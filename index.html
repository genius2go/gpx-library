<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Library · Formula 40PC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:       #0d1b2a;
      --ink-mid:   #1e3249;
      --sea:       #1a3a5c;
      --sea-light: #2a5f8f;
      --wake:      #4a9eca;
      --foam:      #e8f4f8;
      --gold:      #c8a84b;
      --red:       #c84b4b;
      --green:     #4aeca0;
      --mono:      'IBM Plex Mono', monospace;
      --serif:     'Libre Baskerville', serif;
      --r:         4px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ink); color: var(--foam); font-family: var(--mono); font-size: 13px; line-height: 1.6; min-height: 100vh; }

    /* ── Header ── */
    .site-header {
      background: var(--ink-mid);
      border-bottom: 1px solid #1e3a55;
      padding: 14px 20px;
      display: flex; align-items: center; gap: 16px;
      position: sticky; top: 0; z-index: 1000;
    }
    .wordmark { font-family: var(--serif); font-size: 17px; color: var(--foam); }
    .wordmark span { color: var(--wake); }
    .header-sub { font-size: 10px; color: #4a7a9b; text-transform: uppercase; letter-spacing: .08em; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    /* ── Shell ── */
    .shell { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 53px); }

    /* ── Sidebar ── */
    .sidebar { background: var(--ink-mid); border-right: 1px solid #1a2e45; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-top { padding: 12px; border-bottom: 1px solid #1a2e45; flex-shrink: 0; }

    .drop-zone {
      border: 1.5px dashed var(--sea-light); border-radius: var(--r);
      padding: 14px 12px; text-align: center; cursor: pointer;
      transition: all .2s; background: rgba(26,58,92,.3); position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--wake); background: rgba(74,158,202,.1); }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .dz-label { color: var(--wake); font-size: 11px; font-weight: 600; }
    .dz-sub { color: #5a8aaa; font-size: 10px; margin-top: 2px; display: block; }

    .search-row { margin-top: 9px; position: relative; }
    .search-row input {
      width: 100%; background: rgba(0,0,0,.3); border: 1px solid #1e3a55;
      border-radius: var(--r); color: var(--foam); font-family: var(--mono);
      font-size: 12px; padding: 6px 10px 6px 26px; outline: none; transition: border-color .2s;
    }
    .search-row input::placeholder { color: #3a6688; }
    .search-row input:focus { border-color: var(--wake); }
    .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: #3a6688; font-size: 11px; pointer-events: none; }

    .list-meta { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; border-bottom: 1px solid #1a2e45; font-size: 10px; color: #3a6688; text-transform: uppercase; letter-spacing: .08em; flex-shrink: 0; }
    .sort-btn { background: none; border: none; color: #3a6688; font-family: var(--mono); font-size: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: .08em; }
    .sort-btn:hover { color: var(--wake); }

    .track-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1e3a55 transparent; }
    .track-list::-webkit-scrollbar { width: 4px; }
    .track-list::-webkit-scrollbar-thumb { background: #1e3a55; border-radius: 2px; }

    .track-item { padding: 10px 14px; border-bottom: 1px solid #1a2e45; cursor: pointer; transition: background .15s; position: relative; }
    .track-item:hover { background: rgba(74,158,202,.06); }
    .track-item.active { background: rgba(74,158,202,.12); border-left: 2px solid var(--wake); padding-left: 12px; }
    .ti-name { font-size: 12px; font-weight: 600; color: var(--foam); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
    .ti-meta { font-size: 10px; color: #4a7a9b; margin-top: 2px; }
    .ti-tags { margin-top: 4px; display: flex; gap: 3px; flex-wrap: wrap; }
    .tag { background: rgba(26,58,92,.8); border: 1px solid #2a5f8f; border-radius: 2px; color: var(--wake); font-size: 9px; padding: 1px 5px; text-transform: uppercase; letter-spacing: .05em; }
    .tag.builtin { border-color: #2a6f5f; color: #4aeca0; }
    .ti-delete { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #2a4a65; font-size: 13px; cursor: pointer; padding: 2px 4px; border-radius: 2px; transition: color .15s; }
    .ti-delete:hover { color: var(--red); }

    .empty-state { padding: 36px 20px; text-align: center; color: #2a4a65; }
    .empty-state .es-icon { font-size: 32px; margin-bottom: 10px; }
    .empty-state p { font-size: 12px; line-height: 1.7; }

    /* ── Map ── */
    .map-panel { display: flex; flex-direction: column; position: relative; }
    #map { flex: 1; background: #0a1520; }

    .map-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #1e3a55; text-align: center; pointer-events: none; z-index: 10; }
    .mp-icon { font-size: 44px; margin-bottom: 14px; opacity: .4; }
    .map-placeholder p { font-size: 12px; opacity: .5; }

    /* ── Detail card ── */
    .track-detail {
      background: rgba(13,27,42,.5); border-top: 1px solid #1a2e45;
      padding: 13px 15px; display: none; flex-shrink: 0;
    }
    .track-detail.visible { display: block; }
    .td-name { font-family: var(--serif); font-size: 13px; color: var(--foam); margin-bottom: 8px; line-height: 1.3; }
    .td-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; }
    .stat-label { font-size: 9px; color: #4a7a9b; text-transform: uppercase; letter-spacing: .08em; }
    .stat-value { font-size: 13px; font-weight: 600; color: var(--wake); }
    .td-notes { margin-top: 9px; font-size: 11px; color: #8ab4cc; line-height: 1.5; font-style: italic; border-top: 1px solid #1e3a55; padding-top: 7px; }
    .td-actions { margin-top: 9px; display: flex; gap: 5px; border-top: 1px solid #1e3a55; padding-top: 9px; flex-wrap: wrap; }

    /* ── Buttons ── */
    .btn { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; border: none; border-radius: var(--r); cursor: pointer; padding: 5px 9px; transition: all .15s; display: inline-flex; align-items: center; gap: 4px; }
    .btn-primary { background: var(--wake); color: var(--ink); }
    .btn-primary:hover { background: #5dbae0; }
    .btn-ghost { background: transparent; border: 1px solid var(--sea-light); color: var(--wake); }
    .btn-ghost:hover { border-color: var(--wake); background: rgba(74,158,202,.1); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink-mid); border: 1px solid var(--sea-light); border-radius: var(--r); padding: 9px 14px; font-size: 12px; color: var(--wake); z-index: 9999; opacity: 0; transform: translateY(6px); transition: all .25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Modal ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 2000; display: none; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--ink-mid); border: 1px solid var(--sea-light); border-radius: var(--r); padding: 22px; width: 420px; max-width: 90vw; }
    .modal h2 { font-family: var(--serif); font-size: 15px; color: var(--foam); margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 10px; color: #4a7a9b; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; background: rgba(0,0,0,.3); border: 1px solid #1e3a55; border-radius: var(--r); color: var(--foam); font-family: var(--mono); font-size: 12px; padding: 7px 9px; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--wake); }
    .form-group textarea { resize: vertical; min-height: 65px; }
    .modal-actions { display: flex; gap: 7px; justify-content: flex-end; margin-top: 18px; }

    /* Export hint */
    .export-hint { font-size: 9px; color: #3a6688; margin-top: 7px; line-height: 1.4; }

    /* Divider in list */
    .list-divider { padding: 5px 14px; font-size: 9px; color: #2a4a65; text-transform: uppercase; letter-spacing: .1em; border-bottom: 1px solid #1a2e45; background: rgba(0,0,0,.15); }

    @media (max-width: 700px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: 260px 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid #1e3a55; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div>
    <div class="wordmark">⚓ Track <span>Library</span></div>
    <div class="header-sub">Formula 40PC · Miami Beach</div>
  </div>
  <div class="header-right">
    <span id="headerCount" style="font-size:10px;color:#4a7a9b;text-transform:uppercase;letter-spacing:.06em"></span>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".gpx" multiple />
        <div class="dz-label">📡 Drop GPX files here</div>
        <span class="dz-sub">or tap to browse · multiple files OK</span>
      </div>
      <div class="search-row">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search tracks…" />
      </div>
    </div>
    <div class="list-meta">
      <span id="listCount"></span>
      <button class="sort-btn" id="sortBtn">Date ↓</button>
    </div>
    <div class="track-list" id="trackList"></div>
    <div class="track-detail" id="trackDetail">
      <div class="td-name" id="tdName"></div>
      <div class="td-stats" id="tdStats"></div>
      <div class="td-notes" id="tdNotes" style="display:none"></div>
      <div class="td-actions">
        <button class="btn btn-primary" id="btnShare">↑ Share</button>
        <button class="btn btn-ghost" id="btnDownloadTrack">↓ Track</button>
        <button class="btn btn-ghost" id="btnDownloadRoute">↓ Route</button>
        <button class="btn btn-ghost" id="btnEdit">✎ Edit</button>
      </div>
      <div class="export-hint">Track = raw GPX for your Axiom · Route = 50 wpts for Garmin/sharing</div>
    </div>
  </aside>

  <main class="map-panel">
    <div id="map"></div>
    <div class="map-placeholder" id="mapPlaceholder">
      <div class="mp-icon">⚓</div>
      <p>Select a track to view it on the chart</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>Edit Track</h2>
    <div class="form-group"><label>Name</label><input type="text" id="editName" /></div>
    <div class="form-group"><label>Date</label><input type="date" id="editDate" /></div>
    <div class="form-group"><label>Tags <span style="font-size:9px;color:#3a6688">(comma-separated)</span></label><input type="text" id="editTags" placeholder="offshore, ICW, delivery…" /></div>
    <div class="form-group"><label>Notes</label><textarea id="editNotes" placeholder="Conditions, fuel stops, observations…"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelEdit">Cancel</button>
      <button class="btn btn-primary" id="btnSaveEdit">Save</button>
    </div>
  </div>
</div>

const STORAGE_KEY = 'gpx_library_v1';
let tracks = [];
let activeId = null;
let sortAsc = false;
let searchQuery = '';
let mapLayers = [];
let editingId = null;

// ── Map ──

// ── Storage ──
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tracks.filter(t => !t.builtin))); } catch(e) {} }
function load() {
  // Always start with builtins
  tracks = BUILTIN_TRACKS.map(t => ({...t}));
  // Add user tracks from storage
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    if (d) {
      const user = JSON.parse(d);
      user.forEach(ut => {
        if (!tracks.find(t => t.id === ut.id)) tracks.push(ut);
      });
    }
  } catch(e) {}
}

// ── GPX parsing ──
function parseGPX(text) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(text, 'text/xml');
  const coords = [];
  xml.querySelectorAll('trkpt, rtept, wpt').forEach(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    if (!isNaN(lat) && !isNaN(lon)) coords.push([lat, lon]);
  });
  const nameEl = xml.querySelector('trk > name, name');
  const timeEl = xml.querySelector('trkpt time, time');
  return {
    coords,
    gpxName: nameEl ? nameEl.textContent.trim() : null,
    gpxDate: timeEl ? timeEl.textContent.slice(0,10) : null
  };
}

function haversine(a, b) {
  const R = 3440.065;
  const dLat = (b[0]-a[0])*Math.PI/180, dLon = (b[1]-a[1])*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}
function calcDist(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) d += haversine(coords[i-1], coords[i]);
  return d;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

// ── Import ──
function importFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.name.toLowerCase().endsWith('.gpx')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const text = e.target.result;
      const { coords, gpxName, gpxDate } = parseGPX(text);
      if (!coords.length) { toast('No track points in ' + file.name, true); return; }
      const name = gpxName || file.name.replace(/\.gpx$/i,'');
      const track = {
        id: uid(), name, date: gpxDate || new Date().toISOString().slice(0,10),
        tags: [], notes: '', gpxData: text, coords,
        dist_nm: calcDist(coords), builtin: false
      };
      tracks.unshift(track);
      save(); renderList(); selectTrack(track.id);
      toast('Imported: ' + name);
    };
    reader.readAsText(file);
  });
}

// ── Render ──
function getFiltered() {
  let r = tracks.filter(t => {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return t.name.toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q) || (t.tags||[]).some(g => g.toLowerCase().includes(q));
  });
  r.sort((a,b) => { const c = (a.date||'').localeCompare(b.date||''); return sortAsc ? c : -c; });
  return r;
}

function renderList() {
  const el = document.getElementById('trackList');
  const filtered = getFiltered();
  const userCount = tracks.filter(t => !t.builtin).length;
  document.getElementById('headerCount').textContent = `${tracks.length} tracks`;
  document.getElementById('listCount').textContent = filtered.length === tracks.length ? `${tracks.length} tracks` : `${filtered.length} of ${tracks.length}`;

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state"><div class="es-icon">${tracks.length?'🔍':'🗺'}</div><p>${tracks.length?'No matches.':'Drop a GPX file to get started.'}</p></div>`;
    return;
  }

  // Group: user tracks first, then builtins
  const user = filtered.filter(t => !t.builtin);
  const builtin = filtered.filter(t => t.builtin);

  let html = '';
  if (user.length) {
    html += `<div class="list-divider">My Tracks (${user.length})</div>`;
    html += user.map(t => trackItemHTML(t)).join('');
  }
  if (builtin.length) {
    html += `<div class="list-divider">Miami → East Falmouth · June 2026 (${builtin.length} legs)</div>`;
    html += builtin.map(t => trackItemHTML(t)).join('');
  }
  el.innerHTML = html;

  el.querySelectorAll('.track-item').forEach(item => {
    item.addEventListener('click', e => { if (e.target.classList.contains('ti-delete')) return; selectTrack(item.dataset.id); });
  });
  el.querySelectorAll('.ti-delete').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); deleteTrack(btn.dataset.id); });
  });
}

function trackItemHTML(t) {
  const dist = t.dist_nm ? t.dist_nm.toFixed(1)+' nm' : '';
  const speed = t.max_kts ? ` · ${t.max_kts} kts max` : '';
  const tags = (t.tags||[]).map(g => `<span class="tag${t.builtin?' builtin':''}">${esc(g)}</span>`).join('');
  return `<div class="track-item${t.id===activeId?' active':''}" data-id="${t.id}">
    <div class="ti-name">${esc(t.name)}</div>
    <div class="ti-meta">${t.date||''}${dist?' · '+dist:''}${speed}</div>
    ${tags?`<div class="ti-tags">${tags}</div>`:''}
    ${!t.builtin?`<button class="ti-delete" data-id="${t.id}" title="Remove">✕</button>`:''}
  </div>`;
}

// ── Select ──
function selectTrack(id) {
  activeId = id;
  const track = tracks.find(t => t.id === id);
  if (!track) return;
  renderList();

  mapLayers.forEach(l => map.removeLayer(l)); mapLayers = [];
  document.getElementById('mapPlaceholder').style.display = 'none';

  const ll = track.coords.map(c => [c[0], c[1]]);
  const poly = L.polyline(ll, { color:'#4a9eca', weight:2.5, opacity:.9 }).addTo(map);
  mapLayers.push(poly);

  const mkStart = L.divIcon({ html:'<div style="width:8px;height:8px;background:#4aeca0;border-radius:50%;border:2px solid #0d1b2a"></div>', iconSize:[8,8], iconAnchor:[4,4], className:'' });
  const mkEnd   = L.divIcon({ html:'<div style="width:8px;height:8px;background:#4a9eca;border-radius:50%;border:2px solid #0d1b2a"></div>', iconSize:[8,8], iconAnchor:[4,4], className:'' });
  if (ll.length) {
    mapLayers.push(L.marker(ll[0], {icon:mkStart}).addTo(map));
    if (ll.length > 1) mapLayers.push(L.marker(ll[ll.length-1], {icon:mkEnd}).addTo(map));
  }
  map.fitBounds(poly.getBounds(), { padding:[40,40] });

  // Detail card
  document.getElementById('tdName').textContent = track.name;
  document.getElementById('tdStats').innerHTML = `
    <div><div class="stat-label">Distance</div><div class="stat-value">${track.dist_nm?track.dist_nm.toFixed(1)+' nm':'—'}</div></div>
    <div><div class="stat-label">Max Speed</div><div class="stat-value">${track.max_kts?track.max_kts+' kts':'—'}</div></div>
    <div><div class="stat-label">Date</div><div class="stat-value">${track.date||'—'}</div></div>
    <div><div class="stat-label">Duration</div><div class="stat-value">${track.dur_h?track.dur_h+'h':'—'}</div></div>`;
  const notesEl = document.getElementById('tdNotes');
  if (track.notes) { notesEl.textContent = track.notes; notesEl.style.display='block'; } else { notesEl.style.display='none'; }
  document.getElementById('trackDetail').classList.add('visible');
}

function deleteTrack(id) {
  const t = tracks.find(t => t.id === id);
  if (t && t.builtin) { toast('Built-in tracks cannot be removed', true); return; }
  tracks = tracks.filter(t => t.id !== id);
  if (activeId === id) {
    activeId = null;
    mapLayers.forEach(l => map.removeLayer(l)); mapLayers = [];
    document.getElementById('trackDetail').classList.remove('visible');
    document.getElementById('mapPlaceholder').style.display = 'flex';
  }
  save(); renderList(); toast('Track removed');
}

// ── Share ──
function shareTrack(id) {
  const track = tracks.find(t => t.id === id);
  if (!track) return;
  try {
    const payload = JSON.stringify({ name:track.name, date:track.date, tags:track.tags, notes:track.notes, coords:track.coords, dist_nm:track.dist_nm });
    const encoded = btoa(unescape(encodeURIComponent(payload)));
    const url = location.origin + location.pathname + '#share=' + encoded;
    if (url.length > 200000) { toast('Track too large for URL — use GPX download', true); return; }
    navigator.clipboard.writeText(url).then(() => toast('✓ Share link copied')).catch(() => {
      const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('✓ Share link copied');
    });
  } catch(e) { toast('Could not generate share link', true); }
}

// ── Download Track (raw GPX) ──
function downloadTrack(id) {
  const track = tracks.find(t => t.id === id);
  if (!track) return;
  let gpxText = track.gpxData;
  if (!gpxText) {
    const pts = track.coords.map(c => `    <trkpt lat="${c[0]}" lon="${c[1]}"></trkpt>`).join('\n');
    gpxText = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Track Library">\n  <trk><name>${esc(track.name)}</name><trkseg>\n${pts}\n  </trkseg></trk>\n</gpx>`;
  }
  const blob = new Blob([gpxText], {type:'application/gpx+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = track.name.replace(/[^a-z0-9\-_]/gi,'_') + '_track.gpx';
  a.click(); URL.revokeObjectURL(a.href);
  toast('↓ Track: ' + track.name);
}

// ── Douglas-Peucker simplification ──
function perpendicularDist(pt, lineStart, lineEnd) {
  const dx = lineEnd[0] - lineStart[0];
  const dy = lineEnd[1] - lineStart[1];
  if (dx === 0 && dy === 0) {
    return Math.sqrt((pt[0]-lineStart[0])**2 + (pt[1]-lineStart[1])**2);
  }
  const t = ((pt[0]-lineStart[0])*dx + (pt[1]-lineStart[1])*dy) / (dx*dx + dy*dy);
  const tc = Math.max(0, Math.min(1, t));
  return Math.sqrt((pt[0]-(lineStart[0]+tc*dx))**2 + (pt[1]-(lineStart[1]+tc*dy))**2);
}

function douglasPeucker(coords, epsilon) {
  if (coords.length <= 2) return coords;
  let maxDist = 0, maxIdx = 0;
  for (let i = 1; i < coords.length - 1; i++) {
    const d = perpendicularDist(coords[i], coords[0], coords[coords.length-1]);
    if (d > maxDist) { maxDist = d; maxIdx = i; }
  }
  if (maxDist > epsilon) {
    const left  = douglasPeucker(coords.slice(0, maxIdx+1), epsilon);
    const right = douglasPeucker(coords.slice(maxIdx), epsilon);
    return [...left.slice(0,-1), ...right];
  }
  return [coords[0], coords[coords.length-1]];
}

function simplifyToTarget(coords, target) {
  // Binary search for the epsilon that gets us close to target waypoints
  let lo = 0, hi = 1, best = coords;
  for (let i = 0; i < 20; i++) {
    const mid = (lo + hi) / 2;
    const result = douglasPeucker(coords, mid);
    if (result.length > target) lo = mid;
    else { hi = mid; best = result; }
    if (Math.abs(result.length - target) <= 2) { best = result; break; }
  }
  // Always keep at least start and end
  return best.length >= 2 ? best : [coords[0], coords[coords.length-1]];
}

// ── Download Route (simplified GPX route for Garmin/sharing) ──
function downloadRoute(id) {
  const track = tracks.find(t => t.id === id);
  if (!track) return;

  const TARGET_WPTS = 50;
  const simplified = simplifyToTarget(track.coords, TARGET_WPTS);

  const wpts = simplified.map((c, i) => {
    const num = String(i+1).padStart(3,'0');
    return `    <rtept lat="${c[0].toFixed(6)}" lon="${c[1].toFixed(6)}">\n      <name>WPT${num}</name>\n    </rtept>`;
  }).join('\n');

  const gpxText = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Track Library"
  xmlns="http://www.topografix.com/GPX/1/1"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>${esc(track.name)}</name>
    <desc>Route exported from Track Library · ${simplified.length} waypoints · Original: ${track.coords.length} trackpoints</desc>
    <time>${track.date ? track.date+'T00:00:00Z' : new Date().toISOString()}</time>
  </metadata>
  <rte>
    <name>${esc(track.name)}</name>
    <desc>${simplified.length} waypoints · Douglas-Peucker simplified from ${track.coords.length} pts</desc>
${wpts}
  </rte>
</gpx>`;

  const blob = new Blob([gpxText], {type:'application/gpx+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = track.name.replace(/[^a-z0-9\-_]/gi,'_') + '_route.gpx';
  a.click(); URL.revokeObjectURL(a.href);
  toast(`↓ Route: ${track.name} (${simplified.length} waypoints)`);
}

// ── Edit ──
function openEdit(id) {
  editingId = id;
  const t = tracks.find(t => t.id === id);
  if (!t) return;
  document.getElementById('editName').value = t.name;
  document.getElementById('editDate').value = t.date||'';
  document.getElementById('editTags').value = (t.tags||[]).join(', ');
  document.getElementById('editNotes').value = t.notes||'';
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeEdit() { document.getElementById('modalBackdrop').classList.remove('open'); editingId = null; }
function saveEdit() {
  const t = tracks.find(t => t.id === editingId); if (!t) return;
  t.name = document.getElementById('editName').value.trim() || t.name;
  t.date = document.getElementById('editDate').value;
  t.tags = document.getElementById('editTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  t.notes = document.getElementById('editNotes').value.trim();
  save(); closeEdit(); renderList();
  if (activeId === editingId) selectTrack(editingId);
  toast('Saved');
}

// ── Handle share URL ──
function handleShareUrl() {
  if (!location.hash.startsWith('#share=')) return;
  try {
    const payload = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(7)))));
    if (tracks.find(t => t.name === payload.name && t.date === payload.date)) return;
    const track = { id:uid(), name:payload.name, date:payload.date, tags:payload.tags||[], notes:payload.notes||'', coords:payload.coords, dist_nm:payload.dist_nm, builtin:false };
    tracks.unshift(track); save(); renderList(); selectTrack(track.id);
    toast('✓ Shared track added to library');
    history.replaceState(null, '', location.pathname);
  } catch(e) { toast('Could not load shared track', true); }
}

// ── Toast ──
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.color = err ? '#e07070' : ''; el.style.borderColor = err ? '#5a2a2a' : '';
  el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3000);
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Init ──
function init() {
  load(); renderList(); handleShareUrl();

  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); importFiles(e.dataTransfer.files); });
  document.getElementById('fileInput').addEventListener('change', e => { importFiles(e.target.files); e.target.value=''; });
  document.body.addEventListener('dragover', e => e.preventDefault());
  document.body.addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });

  document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderList(); });
  document.getElementById('sortBtn').addEventListener('click', () => { sortAsc = !sortAsc; document.getElementById('sortBtn').textContent = sortAsc?'Date ↑':'Date ↓'; renderList(); });

  document.getElementById('btnShare').addEventListener('click', () => activeId && shareTrack(activeId));
  document.getElementById('btnDownloadTrack').addEventListener('click', () => activeId && downloadTrack(activeId));
  document.getElementById('btnDownloadRoute').addEventListener('click', () => activeId && downloadRoute(activeId));
  document.getElementById('btnEdit').addEventListener('click', () => activeId && openEdit(activeId));

  document.getElementById('btnCancelEdit').addEventListener('click', closeEdit);
  document.getElementById('btnSaveEdit').addEventListener('click', saveEdit);
  document.getElementById('modalBackdrop').addEventListener('click', e => { if(e.target===document.getElementById('modalBackdrop')) closeEdit(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeEdit(); });

  // Select first leg by default
  if (tracks.length) selectTrack(tracks[tracks.length-1].id);
}

document.addEventListener('DOMContentLoaded', init);
</script>
